<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TCG Pocket Tracker</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- ══ LOGIN SCREEN ══ -->
<div id="loginScreen" class="login-screen">
  <div class="login-card">
    <div class="login-logo">⚡</div>
    <h1 class="login-title">TCG Pocket <span>Tracker</span></h1>
    <p class="login-sub">Lleva el control de tu colección y sabe qué sobres abrir.</p>
    <button class="google-btn" id="loginBtn">
      <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
      Continuar con Google
    </button>
    <p class="login-note">Tu colección se guarda en la nube vinculada a tu cuenta.</p>
  </div>
</div>

<!-- ══ APP ══ -->
<div id="app" class="app hidden">

  <!-- TOP BAR -->
  <header class="topbar">
    <div class="logo" onclick="showDash()">TCG<span>·</span>POCKET</div>
    <div class="sep"></div>
    <button class="tab active" id="t-dash" onclick="showDash()">Inicio</button>
    <button class="tab" id="t-col" onclick="showColView()">Colección</button>
    <div class="flex1"></div>
    <div class="gpills" id="gpills"></div>
    <div class="user-area" id="userArea"></div>
  </header>

  <div class="body">

    <!-- SIDEBAR -->
    <aside class="sidebar" id="sidebar">
      <div class="sb-section">Serie A</div>
      <div id="sb-A"></div>
      <div class="sb-section">Serie B</div>
      <div id="sb-B"></div>
    </aside>

    <!-- CONTENT -->
    <main class="content" id="content">

      <!-- DASHBOARD -->
      <div id="view-dash" class="view">
        <div class="dash-head">
          <h1>¿Qué sobres abrir <em>hoy</em>?</h1>
          <p>Las expansiones están ordenadas por prioridad según las cartas que te faltan.</p>
        </div>
        <div id="expList" class="exp-list">
          <div class="loader">Cargando expansiones…</div>
        </div>
      </div>

      <!-- COLLECTION -->
      <div id="view-col" class="view hidden">
        <div class="col-toolbar">
          <div class="col-head">
            <span class="col-code" id="colCode"></span>
            <span class="col-name" id="colName"></span>
          </div>
          <div class="pack-pills" id="packPills"></div>
          <div class="flex1"></div>
          <input class="search-box" id="searchBox" placeholder="Buscar carta…" oninput="renderCards()">
          <button class="ghost-btn danger" onclick="confirmReset()">Borrar todo</button>
        </div>
        <div class="cards-area">
          <div id="cardsGrid" class="cards-grid"></div>
        </div>
      </div>

    </main>
  </div>
</div>

<div class="toast" id="toast"></div>

<!-- Firebase SDKs -->
<script type="module" src="js/firebase.js"></script>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
</body>
</html>
