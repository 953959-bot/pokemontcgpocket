<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokémon TCG Pocket - Tracker</title>
    <style>
        :root { --primary: #e3350d; --bg-color: #f4f4f9; --card-bg: #fff; --text-dark: #333; --border-radius: 8px; }
        body { font-family: 'Segoe UI', sans-serif; background-color: var(--bg-color); color: var(--text-dark); margin: 0; display: flex; flex-direction: column; align-items: center; }
        header { background-color: var(--primary); color: white; width: 100%; text-align: center; padding: 1rem 0; box-shadow: 0 4px 6px rgba(0,0,0,0.1); display: flex; flex-direction: column; align-items: center; }
        .auth-bar { background: #b32a0a; width: 100%; padding: 0.5rem; text-align: right; box-sizing: border-box; display: flex; justify-content: flex-end; align-items: center; gap: 10px; color: white; }
        .auth-bar button { padding: 5px 15px; cursor: pointer; border: none; border-radius: 4px; font-weight: bold; background: white; color: var(--primary); }
        main { max-width: 800px; width: 90%; margin: 2rem auto; background: var(--card-bg); padding: 2rem; border-radius: var(--border-radius); box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        .collection-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 1.5rem; padding-bottom: 1rem; border-bottom: 2px solid #eee; }
        select { padding: 0.5rem; font-size: 1rem; border-radius: 4px; }
        .pack-image-container { max-width: 250px; }
        .pack-image-container img { width: 100%; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
        .recommendation-box { background-color: #e8f4f8; border-left: 5px solid #3498db; padding: 1rem; margin-bottom: 2rem; border-radius: 4px; }
        .card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 1rem; }
        .card-item { background: #fdfdfd; border: 1px solid #e0e0e0; padding: 1rem; border-radius: var(--border-radius); cursor: pointer; }
        .card-item.missing { background-color: #ffe6e6; border-color: var(--primary); }
    </style>
</head>
<body>

    <div class="auth-bar">
        <span id="user-info" style="display: none;">Conectado como: <b id="user-name"></b></span>
        <button id="login-btn">Iniciar sesión con Google</button>
        <button id="logout-btn" style="display: none;">Cerrar sesión</button>
    </div>

    <header>
        <h1>Pocket Pack Tracker</h1>
        <p>Tu colección guardada en la nube</p>
    </header>

    <main>
        <div class="collection-header">
            <div>
                <label for="collection-select"><strong>Colección:</strong></label><br><br>
                <select id="collection-select"></select>
                <p id="cloud-status" style="color: #666; font-size: 0.9em; margin-top: 15px;">Inicia sesión para guardar en la nube.</p>
            </div>
            <div class="pack-image-container">
                <img id="pack-image" src="" alt="Sobres de la expansión">
            </div>
        </div>

        <div class="recommendation-box" id="recommendation-box">
            <h2 style="margin-top:0; color:#2980b9;">Recomendación</h2>
            <p id="recommendation-text">Cargando...</p>
        </div>

        <h3>Lista de Cartas (Marca las que te FALTAN)</h3>
        <div class="card-grid" id="card-grid"></div>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

        // === ¡Copia tu configuración de Firebase aquí en el Paso 2! ===
        const firebaseConfig = {
          apiKey: "AIzaSyDkhlFfl4S2p83v42SPfmKuF7htyjyj1LY",
          authDomain: "tcgpocket-fd71b.firebaseapp.com",
          projectId: "tcgpocket-fd71b",
          storageBucket: "tcgpocket-fd71b.firebasestorage.app",
          messagingSenderId: "188594442466",
          appId: "1:188594442466:web:175fd7d0b0bf68c7f2cebb",
          measurementId: "G-83HDXXFQP1"
        };
        // Inicializar Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();

        // === Base de datos de expansiones ===
        const database = {
            "genetic_apex": {
                name: "Genetic Apex (A1)",
                image: "https://via.placeholder.com/300x150/e3350d/ffffff?text=Sobres+Genetic+Apex", 
                packs: ["Charizard", "Mewtwo", "Pikachu"],
                cards: [
                    { id: "ga1", name: "Charizard ex", packs: ["Charizard"] },
                    { id: "ga2", name: "Mewtwo ex", packs: ["Mewtwo"] },
                    { id: "ga3", name: "Pikachu ex", packs: ["Pikachu"] }
                ]
            },
            "fantastical_parade": {
                name: "Fantastical Parade",
                image: "https://via.placeholder.com/300x150/9b59b6/ffffff?text=Sobres+Fantastical+Parade",
                packs: ["Gardevoir"],
                cards: [
                    { id: "fp1", name: "Gardevoir ex", packs: ["Gardevoir"] },
                    { id: "fp2", name: "Sylveon", packs: ["Gardevoir"] }
                ]
            },
            "chaos_rising": {
                name: "Chaos Rising",
                image: "https://via.placeholder.com/300x150/e67e22/ffffff?text=Sobres+Chaos+Rising",
                packs: ["Lucario", "Zygarde"],
                cards: [
                    { id: "cr1", name: "Mega Lucario ex", packs: ["Lucario"] },
                    { id: "cr2", name: "Mega Zygarde ex", packs: ["Zygarde"] }
                ]
            }
        };

        // Variables de estado
        let currentCollection = "genetic_apex";
        let missingCards = []; 
        let currentUser = null;

        // Elementos DOM
        const selectEl = document.getElementById('collection-select');
        const gridEl = document.getElementById('card-grid');
        const packImgEl = document.getElementById('pack-image');
        const statusEl = document.getElementById('cloud-status');
        const recText = document.getElementById('recommendation-text');

        // Inicializar UI
        function initUI() {
            for (const [key, val] of Object.entries(database)) {
                const opt = document.createElement('option');
                opt.value = key;
                opt.textContent = val.name;
                selectEl.appendChild(opt);
            }
            selectEl.addEventListener('change', (e) => {
                currentCollection = e.target.value;
                renderCards();
            });
            renderCards();
        }

        // Renderizar Cartas
        function renderCards() {
            const collection = database[currentCollection];
            packImgEl.src = collection.image; // Cambia la imagen del sobre
            gridEl.innerHTML = '';

            collection.cards.forEach(card => {
                const isMissing = missingCards.includes(card.id);
                const div = document.createElement('div');
                div.className = `card-item ${isMissing ? 'missing' : ''}`;
                div.innerHTML = `<strong>${card.name}</strong><br><small>${card.packs.join(', ')}</small>`;
                
                div.addEventListener('click', () => {
                    if (isMissing) {
                        missingCards = missingCards.filter(id => id !== card.id);
                    } else {
                        missingCards.push(card.id);
                    }
                    renderCards(); // Re-render visual
                    saveToCloud(); // Guardar en Firebase
                });
                gridEl.appendChild(div);
            });
            calculateRecommendation();
        }

        function calculateRecommendation() {
            const packs = {};
            const collection = database[currentCollection];
            
            missingCards.forEach(cardId => {
                const card = collection.cards.find(c => c.id === cardId);
                if(card) card.packs.forEach(p => { packs[p] = (packs[p] || 0) + 1 });
            });

            const sorted = Object.entries(packs).sort((a,b) => b[1] - a[1]);
            if(sorted.length === 0) {
                recText.innerHTML = "¡Tienes todas las cartas o no has marcado ninguna!";
                return;
            }
            recText.innerHTML = `Abre sobres de: <strong>${sorted[0][0]}</strong>. Te faltan ${sorted[0][1]} cartas de ahí.`;
        }

        // --- LÓGICA DE FIREBASE (NUBE) ---
        async function loadFromCloud(uid) {
            statusEl.textContent = "Cargando tu colección...";
            const docRef = doc(db, "users", uid);
            const docSnap = await getDoc(docRef);
            if (docSnap.exists()) {
                missingCards = docSnap.data().missingCards || [];
            } else {
                missingCards = [];
            }
            statusEl.textContent = "Colección sincronizada con la nube ☁️";
            renderCards();
        }

        async function saveToCloud() {
            if (!currentUser) return;
            statusEl.textContent = "Guardando...";
            await setDoc(doc(db, "users", currentUser.uid), {
                missingCards: missingCards
            }, { merge: true });
            statusEl.textContent = "Guardado automático en la nube ☁️";
        }

        // Eventos de Login/Logout
        document.getElementById('login-btn').addEventListener('click', () => signInWithPopup(auth, provider));
        document.getElementById('logout-btn').addEventListener('click', () => signOut(auth));

        // Observador de estado de sesión
        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUser = user;
                document.getElementById('login-btn').style.display = 'none';
                document.getElementById('user-info').style.display = 'inline';
                document.getElementById('logout-btn').style.display = 'inline';
                document.getElementById('user-name').textContent = user.displayName;
                loadFromCloud(user.uid);
            } else {
                currentUser = null;
                missingCards = []; // Limpiar pantalla al cerrar sesión
                document.getElementById('login-btn').style.display = 'inline';
                document.getElementById('user-info').style.display = 'none';
                document.getElementById('logout-btn').style.display = 'none';
                statusEl.textContent = "Inicia sesión para guardar en la nube.";
                renderCards();
            }
        });

        initUI();
    </script>
</body>
</html>
