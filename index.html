<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokémon TCG Pocket - Álbum Visual</title>
    <style>
        :root { --primary: #e3350d; --bg-color: #121212; --card-bg: #1e1e1e; --text-light: #f0f0f0; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--bg-color); color: var(--text-light); margin: 0; padding-bottom: 50px; }
        
        /* Cabecera y Autenticación */
        .auth-bar { background: #b32a0a; padding: 0.5rem 1rem; display: flex; justify-content: space-between; align-items: center; font-size: 0.9rem; }
        .auth-bar button { padding: 6px 12px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; background: white; color: var(--primary); }
        
        header { background: var(--primary); text-align: center; box-shadow: 0 4px 10px rgba(0,0,0,0.5); position: sticky; top: 0; z-index: 100; display: flex; flex-direction: column; }
        header h1 { margin: 15px 0 5px 0; font-size: 1.5rem; }
        #global-status { font-size: 0.8rem; opacity: 0.9; margin-bottom: 10px; }

        /* Barra de Navegación de Expansiones (TABS) */
        .tab-bar { display: flex; overflow-x: auto; background: #00000033; padding: 10px; gap: 10px; scrollbar-width: thin; }
        .tab-bar::-webkit-scrollbar { height: 6px; }
        .tab-bar::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.3); border-radius: 3px; }
        
        .tab { padding: 8px 16px; background: rgba(255,255,255,0.1); border: 2px solid transparent; border-radius: 20px; color: white; white-space: nowrap; cursor: pointer; font-weight: bold; transition: all 0.2s; }
        .tab:hover { background: rgba(255,255,255,0.2); }
        .tab.active { background: white; color: var(--primary); border-color: white; box-shadow: 0 0 10px rgba(255,255,255,0.5); }

        main { max-width: 1200px; width: 95%; margin: 1.5rem auto; }

        /* Información de la expansión activa */
        .expansion-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; padding-bottom: 10px; border-bottom: 1px solid #333; }
        .expansion-header h2 { margin: 0; color: #fff; }
        .progress-text { font-size: 1.1rem; font-weight: bold; color: #aaa; }

        /* Cuadrícula de Cartas */
        .card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; }
        .card-item { background: #222; border-radius: 8px; overflow: hidden; cursor: pointer; position: relative; transition: all 0.2s; border: 3px solid transparent; }
        .card-item img { width: 100%; display: block; filter: grayscale(100%) brightness(35%); transition: all 0.3s; }
        
        /* Estado: CARTA OBTENIDA */
        .card-item.owned { border-color: #ffcb05; box-shadow: 0 0 15px rgba(255, 203, 5, 0.3); }
        .card-item.owned img { filter: grayscale(0%) brightness(100%); }
        
        .card-number { position: absolute; bottom: 5px; right: 8px; background: rgba(0,0,0,0.85); padding: 2px 6px; border-radius: 4px; font-size: 0.75rem; font-weight: bold; z-index: 10; border: 1px solid #444; }

        /* Loader */
        .loader { border: 5px solid #333; border-top: 5px solid var(--primary); border-radius: 50%; width: 50px; height: 50px; animation: spin 1s linear infinite; margin: 50px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div class="auth-bar">
        <div><span id="user-info" class="hidden">👤 <b id="user-name"></b></span></div>
        <div>
            <button id="login-btn">Conectar con Google</button>
            <button id="logout-btn" class="hidden">Cerrar Sesión</button>
        </div>
    </div>

    <header>
        <h1>Mi Álbum TCG Pocket</h1>
        <div id="global-status">Descargando cartas oficiales...</div>
        <div class="tab-bar hidden" id="tab-bar"></div>
    </header>

    <main>
        <div id="main-loader" class="loader"></div>

        <div id="app-content" class="hidden">
            <div class="expansion-header">
                <h2 id="current-expansion-title">Expansión</h2>
                <div class="progress-text" id="progress-text">0 / 0</div>
            </div>
            
            <div class="card-grid" id="card-grid"></div>
        </div>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

        // Configuración de Firebase
        const firebaseConfig = {
          apiKey: "AIzaSyDkhlFfl4S2p83v42SPfmKuF7htyjyj1LY",
          authDomain: "tcgpocket-fd71b.firebaseapp.com",
          projectId: "tcgpocket-fd71b",
          storageBucket: "tcgpocket-fd71b.firebasestorage.app",
          messagingSenderId: "188594442466",
          appId: "1:188594442466:web:175fd7d0b0bf68c7f2cebb"
        };
        
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();

        // Diccionario de nombres reales de expansiones
        const officialExpansionNames = {
            "A1": "Genetic Apex",
            "A1a": "Mythical Island",
            "A2": "Space-Time Smackdown",
            "A2a": "Triumphant Light",
            "A3": "Celestial Guardians",
            "A3a": "Extradimensional Crisis",
            "A4": "Wisdom of Sea and Sky",
            "A4a": "Secluded Springs",
            "A5": "Crimson Blaze",
            "A6": "Mega Shine",
            "P-A": "Promo-A"
        };

        let database = {}; 
        let ownedCards = []; 
        let currentUser = null;
        let activeExpansionId = null;

        // --- CARGA DE LA API ---
        async function loadApp() {
            try {
                // Descargamos las cartas mundiales desde el repositorio de la comunidad
                const response = await fetch("https://raw.githubusercontent.com/chase-manning/pokemon-tcg-pocket-cards/refs/heads/main/v4.json");
                const cards = await response.json();

                // Agrupar por expansión
                cards.forEach(card => {
                    const setKey = card.expansion || card.set || "Otros";
                    const realName = officialExpansionNames[setKey] || setKey; // Traduce "A1" a "Genetic Apex"

                    if (!database[setKey]) {
                        database[setKey] = {
                            id: setKey,
                            name: realName,
                            cards: []
                        };
                    }
                    
                    database[setKey].cards.push({
                        id: card.id,
                        name: card.name,
                        number: card.number,
                        image: card.image
                    });
                });

                // Ordenar cartas dentro de cada expansión por su número
                Object.values(database).forEach(exp => {
                    exp.cards.sort((a, b) => {
                        const numA = parseInt(a.number.replace(/\D/g, '')) || 0;
                        const numB = parseInt(b.number.replace(/\D/g, '')) || 0;
                        return numA - numB;
                    });
                });

                document.getElementById('main-loader').classList.add('hidden');
                document.getElementById('app-content').classList.remove('hidden');
                document.getElementById('tab-bar').classList.remove('hidden');
                document.getElementById('global-status').textContent = "Base de datos actualizada ✅";
                
                // Activar la primera expansión por defecto
                activeExpansionId = Object.keys(database)[0];
                renderTabs();
                renderCards();

            } catch (e) {
                console.error(e);
                document.getElementById('global-status').textContent = "Error al descargar las cartas. Revisa tu conexión.";
            }
        }

        // --- RENDERIZADO DE PESTAÑAS (TABS) ---
        function renderTabs() {
            const tabBar = document.getElementById('tab-bar');
            tabBar.innerHTML = '';

            Object.values(database).forEach(exp => {
                const btn = document.createElement('div');
                btn.className = `tab ${exp.id === activeExpansionId ? 'active' : ''}`;
                btn.textContent = exp.name;
                
                btn.onclick = () => {
                    activeExpansionId = exp.id;
                    renderTabs(); // Actualiza el color de la pestaña seleccionada
                    renderCards(); // Carga las cartas de esa pestaña
                };
                
                tabBar.appendChild(btn);
            });
        }

        // --- RENDERIZADO DE CARTAS ---
        function renderCards() {
            if (!activeExpansionId) return;

            const expansion = database[activeExpansionId];
            document.getElementById('current-expansion-title').textContent = expansion.name;
            
            const grid = document.getElementById('card-grid');
            grid.innerHTML = '';

            let ownedInThisExpansion = 0;

            expansion.cards.forEach(card => {
                const isOwned = ownedCards.includes(card.id);
                if (isOwned) ownedInThisExpansion++;

                const div = document.createElement('div');
                div.className = `card-item ${isOwned ? 'owned' : ''}`;
                div.innerHTML = `
                    <img src="${card.image}" loading="lazy" alt="${card.name}">
                    <div class="card-number">${card.number}</div>
                `;
                
                // Evento para marcar/desmarcar
                div.onclick = () => {
                    if (ownedCards.includes(card.id)) {
                        ownedCards = ownedCards.filter(id => id !== card.id);
                    } else {
                        ownedCards.push(card.id);
                    }
                    renderCards(); // Refresca la vista
                    saveToCloud(); // Guarda el progreso
                };
                
                grid.appendChild(div);
            });

            // Actualizar contador
            document.getElementById('progress-text').textContent = `${ownedInThisExpansion} / ${expansion.cards.length}`;
        }

        // --- LÓGICA DE FIREBASE (GUARDADO EN LA NUBE) ---
        async function loadFromCloud(uid) {
            const docSnap = await getDoc(doc(db, "users", uid));
            if (docSnap.exists()) {
                ownedCards = docSnap.data().ownedCards || [];
            }
            if(Object.keys(database).length > 0) renderCards();
        }

        async function saveToCloud() {
            if (!currentUser) return;
            await setDoc(doc(db, "users", currentUser.uid), { ownedCards }, { merge: true });
        }

        // --- GESTIÓN DE SESIÓN ---
        document.getElementById('login-btn').onclick = () => signInWithPopup(auth, provider);
        document.getElementById('logout-btn').onclick = () => signOut(auth);

        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUser = user;
                document.getElementById('login-btn').classList.add('hidden');
                document.getElementById('logout-btn').classList.remove('hidden');
                document.getElementById('user-info').classList.remove('hidden');
                document.getElementById('user-name').textContent = user.displayName;
                loadFromCloud(user.uid);
            } else {
                currentUser = null;
                ownedCards = [];
                document.getElementById('login-btn').classList.remove('hidden');
                document.getElementById('logout-btn').classList.add('hidden');
                document.getElementById('user-info').classList.add('hidden');
                if(Object.keys(database).length > 0) renderCards();
            }
        });

        // Arrancar la aplicación
        loadApp();
    </script>
</body>
</html>
